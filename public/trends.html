<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/icon-32.png" sizes="32x32">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>みんなの9つ | MY NINE LOVES</title>
<meta name="description" content="みんなが選んだ9つを、最新順・人気順で見られます。">
<link rel="canonical" href="https://mynineloves.com/trends">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MY NINE LOVES">
<meta property="og:title" content="みんなの9つ | MY NINE LOVES">
<meta property="og:description" content="みんなが選んだ9つと、人気の作品ランキング。">
<meta property="og:url" content="https://mynineloves.com/trends">
<meta property="og:image" content="https://mynineloves.com/icon-512.png">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --ink:#EFF2E8;
    --panel:#FFFFFF;
    --panel-2:#E4E9DA;
    --line:#C8D0BB;
    --text:#1B1F19;
    --muted:#5F6858;
    --obi:#FFC61A;
    --obi-deep:#E09600;
    --pop:#E03A5F;
    --alert:#C9302C;
    --head:#25302A;
    --head-text:#F2F6EC;
    --shadow:0 2px 0 rgba(200,208,187,.8);
    --r:12px;



    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  /* レールを absolute で置くときの基準。これが無いと位置がずれる */
  body{position:relative;margin:0;background:var(--ink);color:var(--text);font-family:var(--gothic);
       -webkit-font-smoothing:antialiased;padding-bottom:60px}
  @media (min-width:1024px){ body{zoom:1.10} }
  @media (min-width:1600px){ body{zoom:1.15} }
  a{color:var(--pop)}
  .langsw{display:flex;border:1px solid #56624F;border-radius:999px;overflow:hidden}
  .langopt{background:transparent;border:0;color:#A9B6A2;cursor:pointer;
    font-family:var(--gothic);font-size:11px;padding:6px 13px;white-space:nowrap}
  .langopt:hover{color:var(--obi)}
  .langopt[aria-pressed=true]{background:var(--obi);color:#2A2622;font-weight:700}
  header{display:flex;background:var(--head);color:var(--head-text);align-items:stretch}
  .obi-tab{background:var(--obi);color:#2A2622;font-family:var(--mono);font-size:11px;
           letter-spacing:.18em;padding:14px 10px;writing-mode:vertical-rl}
  .head-text{padding:18px 16px}
  .head-text h1{font-family:var(--mincho);font-weight:600;font-size:22px;margin:0 0 4px;letter-spacing:.06em}
  .head-text p{margin:0;font-size:12px;color:#A9B6A2}
  .head-meta{margin-left:auto;padding:18px;display:flex;align-items:center;gap:14px;font-size:11px;color:#A9B6A2}
  main{max-width:760px;margin:0 auto;padding:24px 20px}
  .tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{padding:13px 20px;font-size:13px;color:var(--muted);text-decoration:none;
    white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
  .tab:hover{color:var(--text);background:var(--panel-2)}
  .tab.on{color:var(--text);font-weight:700;border-bottom-color:var(--obi)}

  /* 年代の切り替え。数が多いので、セグメントではなく個別のチップにして折り返す */
  /* 一覧をページ送りで見せる枠 */
  .listbox{width:100%;max-width:680px;height:88vh;background:var(--ink);
    border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 8px 32px rgba(27,31,25,.3)}
  .listbody{overscroll-behavior:contain;flex:1;overflow:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
  /* 本文内の広告。作品の一覧とは混ぜず、独立した区画として置く */
  /* 同年代のランキングが見られないときの案内。
     9マスがあるはずの場所に置いて、気づかれるようにする */
  .needborn{grid-column:1 / -1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:48px 20px;gap:6px}
  .needborn .nb-t{font-family:var(--mincho);font-size:17px;margin:0}
  .needborn .nb-d{font-size:13px;color:var(--muted);margin:0;max-width:420px;line-height:1.9}
  .needborn .nb-b{display:inline-block;margin-top:10px;background:var(--obi);
    color:#2A2622;font-weight:700;padding:12px 24px;border-radius:var(--r);
    text-decoration:none;box-shadow:0 3px 0 var(--obi-deep)}
  .pr-block{margin:26px 0;padding-top:18px;border-top:1px solid var(--line)}
  .pr-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;
    color:var(--muted);margin-bottom:10px}
  .pr-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  /* つくるページと同じく、広い画面では2つを横に並べる */
  @media (min-width:600px){
    .pr-row{flex-wrap:nowrap;align-items:flex-start}
    .pr-row > div{flex:1 1 0;min-width:0}
    /* 計測用の1×1画像まで引き伸ばさないよう、<a> の中だけを対象にする */
    .pr-row a img{width:100%;height:auto}
  }
  .pr-row img[width='1']{width:1px!important;height:1px!important}
  .pr-row img{max-width:100%;height:auto;display:block}
  .pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:18px 0 4px}
  .pager button{min-width:38px;padding:9px 10px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;font-family:var(--mono);
    font-size:13px;color:var(--text);cursor:pointer}
  .pager button[aria-pressed=true]{background:var(--obi);border-color:var(--obi-deep);font-weight:700}
  .pager button.gap{border:0;background:transparent;cursor:default;min-width:20px}
  .pager button:disabled{opacity:.6}
  .rank li.top1 .no{color:var(--obi-deep);font-size:18px;font-weight:700}
  .rank li.top2 .no,.rank li.top3 .no{color:var(--pop);font-size:16px;font-weight:700}
  @media (max-width:560px){ .listbox{height:92vh;max-width:100%} }

  /* /c/ のページを前面に出す枠 */
  .framebox{width:100%;max-width:760px;height:88vh;background:var(--panel);
    border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 8px 32px rgba(27,31,25,.3)}
  .framebar{display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--head);color:var(--head-text);flex:0 0 auto}
  .framebar span{flex:1;min-width:0;font-size:13px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .framebar .btn{flex:0 0 auto;padding:7px 12px;font-size:12px}
  .framebar .x{position:static;flex:0 0 auto;background:transparent;
    color:var(--head-text);border:0;font-size:22px;cursor:pointer;line-height:1}
  #cframe{flex:1;width:100%;border:0;background:var(--ink)}
  @media (max-width:560px){ .framebox{height:92vh;max-width:100%} }

  .decades{display:flex;flex-wrap:wrap;gap:6px;border:0;margin-bottom:12px}
  .decades button{
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-family:var(--gothic);font-size:11px;padding:7px 12px;
    border-radius:999px;cursor:pointer;
  }
  /* 「すべての年代」と「同年代」は、作品の年代とは性質が違う
     （作品の発売年ではなく、見る範囲の指定）。角を四角くして区別する。 */
  .decades button[data-kind=scope]{border-radius:8px}
  .decades button[aria-pressed=true]{background:var(--obi);color:#2A2622;
    border-color:var(--obi-deep);font-weight:700}

  /* 左右のレール */
  .rail{display:none}
  /* 120×600のバナーに合わせた幅。実寸に合わせると余白が出ない */
  @media (min-width:1100px){
    /* ページ全体の高さを持つ列にして、中身を sticky で追従させる。
       ヘッダーの下（100px）が頭打ちになり、上に戻すとそこで止まる */
    .rail{position:absolute;top:var(--rail-start,360px);bottom:0;width:120px;display:block;
      font-size:9px;color:var(--muted);text-align:center;
      letter-spacing:.16em;font-family:var(--mono);pointer-events:none}
    .rail > *{pointer-events:auto}
    /* 「PR」は追従する枠の中に出し直すので、元の文字は隠す */
    .rail > span{display:none}
    .rail-l{right:calc(50% + 400px)}
    .rail-r{left:calc(50% + 400px)}
    /* bottom を基準にすると、下端が画面の下に届くまでは本文と一緒に流れ、
       全体が見える位置で貼り付いて追従する */
    .rail .slot-ad{display:flex;flex-direction:column;align-items:center;
}
    .rail .slot-ad::before{content:'PR';display:block;font-family:var(--mono);
      font-size:9px;letter-spacing:.2em;color:var(--muted);margin-bottom:6px}
    .rail .slot-ad:empty{display:none}
    /* 原寸で出す。最上部では下が切れるが、スクロールすれば全体が見える */
    .rail img{max-width:100%;width:auto;height:auto;display:block;margin:0 auto}
  }

  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .seg button{background:var(--panel);border:0;border-left:1px solid var(--line);
    color:var(--muted);font-family:var(--gothic);font-size:12px;padding:9px 14px;cursor:pointer}
  .seg button:first-child{border-left:0}
  .seg button[aria-pressed=true]{background:var(--obi);color:#2A2622;font-weight:700}
  .search{display:flex;gap:6px;flex:1;min-width:200px}
  .search input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:var(--gothic);font-size:14px;padding:9px 11px;border-radius:var(--r)}
  .search input:focus{outline:2px solid var(--obi);outline-offset:1px;border-color:transparent}
  .search button{background:var(--obi);color:#2A2622;border:0;font-weight:700;
    padding:0 16px;border-radius:var(--r);cursor:pointer}

  .xlink{flex:1;min-width:150px;text-align:center;padding:11px 12px;
    border:1px solid var(--line);border-radius:var(--r);font-size:12px;
    text-decoration:none;color:var(--muted)}
  .xlink:hover{border-color:var(--pop);color:var(--pop);background:#FCEFF2}

  .sec{margin-bottom:34px}
  /* 節の始まりを、広告の区切りと同じ線で示す */
  .sec-divided{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .sec-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .sec-head .seg{flex-wrap:wrap}
  .sec-head h2{font-family:var(--mincho);font-size:20px;margin:0;flex:1;min-width:170px}
  .sec-note{font-size:12px;color:var(--muted);margin:-4px 0 14px}

  /* 上位9件を3×3のかたまりで見せる */
  .pack{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:8px;box-shadow:var(--shadow);margin-bottom:12px}

  /* 書き出す画像と同じ体裁にそろえる（左に黄色の帯） */
  .packwrap{display:flex;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
  .packwrap .obi{flex:0 0 22px;background:var(--obi);display:flex;
    align-items:flex-end;justify-content:center;padding:8px 0}
  .packwrap .obi span{writing-mode:vertical-rl;font-family:var(--mono);
    font-size:9px;letter-spacing:.18em;color:#2A2622;white-space:nowrap}
  .packwrap .pack{flex:1;min-width:0;border:0;border-radius:0;
    box-shadow:none;margin:0;background:transparent}

  /* PCでは9つを1画面に収める。高さを決めて、そこに3行を割り付ける。
     上にあるもの（ヘッダー・タブ・絞り込み・見出し・年代）の高さを
     JSで測って --pack-h に入れているので、画面の余りをめいっぱい使える。
     560pxで頭打ちにしていたときは、大きい画面でも表紙が小さいままだった。 */
  @media (min-width:900px){
    .packwrap{max-width:calc(var(--pack-w,760px) + 22px);margin-left:auto;margin-right:auto}
    .packwrap .pack{
      height:var(--pack-h,62vh);
      grid-template-rows:repeat(3,1fr);
    }
    .packwrap .pack .p{aspect-ratio:auto;height:100%}
  }
  /* 表紙の端が白いと、タイルの背景と溶けて「はみ出している」ように見える。
     内側に薄い線を引いて、作品の輪郭が分かるようにする。
     border ではなく inset の影にしているのは、
     マスの寸法を変えずに線を足せるため。 */
  .pack .p{position:relative;aspect-ratio:var(--ratio,.72);background:var(--panel-2);
    border-radius:6px;overflow:hidden;cursor:pointer;display:block;text-decoration:none}
  /* box-shadow:inset は「背景の上・内容の下」に描かれるため、
     画像が全面を覆うと隠れてしまう。画像より上に重ねる。 */
  .pack .p::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    border:1px solid var(--line);border-radius:6px;
  }
  .pack .p img{width:100%;height:100%;object-fit:contain;display:block}
  .pack .p .no{position:absolute;top:3px;left:4px;font-family:var(--mono);font-size:10px;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  .pack .p .nm{position:absolute;left:0;right:0;bottom:0;font-size:10px;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.85));padding:12px 4px 4px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .decades{margin-bottom:12px;flex-wrap:wrap}
  .decades button{font-size:11px;padding:7px 11px}
  .rank{list-style:none;margin:0 0 10px;padding:0;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  .rank li{display:flex;align-items:center;gap:12px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}
  .rank .no{font-family:var(--mono);font-size:12px;color:var(--muted);width:24px;flex:0 0 auto}
  .rank img{width:56px;height:78px;object-fit:contain;border-radius:4px;
    background:var(--panel-2);flex:0 0 auto}
  .rank .info{min-width:0;flex:1}
  .rank .rt{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .rs{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .rn{font-family:var(--mono);font-size:11px;color:var(--pop);flex:0 0 auto}

  .cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  /* スマホは1列だと縦に長くなりすぎるので2列にする */
  @media (max-width:560px){
    .cards{grid-template-columns:repeat(2,1fr);gap:8px}
    .card{padding:8px;gap:7px;border-left-width:4px}
    .card .t{font-size:12px;line-height:1.4}
    .card .m,.card .num{font-size:10px}
    /* 幅150px前後に「題名」と「♥ / view」を横に並べると、
       題名が潰れて折り返しが崩れる。縦に積む。 */
    .card-foot{flex-direction:column;align-items:flex-start;gap:4px}
    .card .num{text-align:left}
    .card .m{line-height:1.5}
    .like{padding:5px 8px;font-size:11px}
  }
  /* 中身の量が違っても高さをそろえる。並べたとき左右がずれて見えなくなる */
  .cards{align-items:stretch}
  .card{display:flex;flex-direction:column;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);padding:12px;
    box-shadow:var(--shadow);cursor:pointer;height:100%;
    /* 書き出す画像と同じく、左に黄色の帯を入れる */
    border-left:5px solid var(--obi)}
  .card .card-foot{margin-top:auto}
  .card-foot{display:flex;align-items:center;gap:10px}
  .card:hover{border-color:var(--obi)}
  .card .body{flex:1;min-width:0}
  .mini{
    display:grid;grid-template-columns:repeat(3,1fr);gap:3px;
    width:100%;text-decoration:none;
  }
  .mini span{
    aspect-ratio:.72;background:var(--panel-2);border-radius:2px;overflow:hidden;
    display:block;position:relative;
  }
  .mini span::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    border:1px solid var(--line);border-radius:2px;
  }
  .mini img{width:100%;height:100%;object-fit:cover;display:block}
  /* タイトルは切らずに2行まで出す。1行＋…だと何のカードか分からない */
  .card .t{font-family:var(--mincho);font-size:15px;margin-bottom:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;line-height:1.45;word-break:break-word}
  .mini span{aspect-ratio:var(--ratio,.72);background:var(--panel-2);border-radius:3px;
    overflow:hidden;display:block;position:relative}
  .mini span::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    border:1px solid var(--line);border-radius:3px;
  }
  .mini img{width:100%;height:100%;object-fit:contain;display:block}
  .card .m{font-size:11px;color:var(--muted)}
  .card .m .kind{color:var(--pop);font-weight:700}
  .card .num{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;flex:0 0 auto}
  .card .num b{color:var(--text);font-weight:500}
  .like{background:none;border:1px solid var(--line);color:var(--muted);border-radius:var(--r);
    padding:7px 11px;font-size:12px;cursor:pointer;flex:0 0 auto}
  .like:hover{border-color:var(--pop);color:var(--pop);background:#FCEFF2}
  .like[disabled]{opacity:.5;cursor:default}

  .note{font-size:12px;color:var(--muted);text-align:center;padding:22px 0;line-height:1.8}

  /* カードの拡大表示 */
  .veil{position:fixed;inset:0;background:rgba(42,38,34,.55);z-index:60;
    display:none;align-items:center;justify-content:center;padding:16px}
  .veil.open{display:flex}
  .sheet{overscroll-behavior:contain;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
    width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px;position:relative}
  .sheet h3{font-family:var(--mincho);font-size:19px;margin:0 0 4px;padding-right:34px}
  .cv-meta{font-size:12px;color:var(--muted);margin:0 0 14px}
  .x{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-size:15px;line-height:1;cursor:pointer}
  .cv-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
  .cv-actions .btn{flex:1;min-width:120px;padding:11px;border:1px solid var(--line);
    background:var(--panel);border-radius:var(--r);font-size:13px;color:var(--text);
    text-align:center;text-decoration:none;cursor:pointer;font-family:var(--gothic)}
  .cv-actions .btn:hover{border-color:var(--pop);color:var(--pop)}
  .cv-actions .like[aria-pressed=true]{background:var(--pop);color:#fff;border-color:var(--pop)}
  .cv-item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:12px;margin-top:10px}
  .cv-item .h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .cv-item img{width:46px;height:62px;object-fit:contain;background:var(--panel-2);border-radius:4px}
  .cv-item .t{font-size:14px;font-weight:700}
  .cv-item .s{font-size:11px;color:var(--muted)}
  .cv-item .pr{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);
    display:block;margin-bottom:5px}
  .cv-item a.buy{display:block;text-align:center;padding:9px;margin-bottom:4px;
    border:1px solid var(--line);border-radius:var(--r);font-size:12px;
    color:var(--muted);text-decoration:none}
  .cv-item a.buy:hover{border-color:var(--pop);color:var(--pop);background:#FCEFF2}
  .more{display:block;width:100%;margin-top:14px;padding:13px;background:var(--panel);
    border:1px solid var(--line);color:var(--text);border-radius:var(--r);cursor:pointer;font-size:13px}
  footer{max-width:760px;margin:40px auto 0;padding:20px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);line-height:1.9}
</style>
</head>
<body>

<header>
  <div class="obi-tab">MY NINE LOVES</div>
  <div class="head-text">
    <h1>みんなの9つ</h1>
    <p>ほかの人が何を選んだかを見る</p>
  </div>
  <div class="head-meta">

<script>
(() => {
  const $ = id => document.getElementById(id);
  // 保存されている種別名は 'album'。'cd' は画面側の呼び名なので両方を引けるようにする
  const LABEL_JA = { album:'CD', cd:'CD', manga:'漫画', book:'書籍', anime:'アニメ',
                     movie:'映画', person:'有名人', character:'キャラ' };
  const LABEL = new Proxy({}, { get: (_, k) => T().kinds[k] || LABEL_JA[k] });
  // 共有時に必ず付く共通タグ。種類別タグは補助なので、ここでは共通タグを追う
  const TAG = { '':'MyNineLoves', album:'MyNineLoves', cd:'MyNineLoves', manga:'MyNineLoves', book:'MyNineLoves',
                anime:'MyNineLoves', movie:'MyNineLoves',
                person:'MyNineLoves', character:'MyNineLoves' };

  let LANG = 'ja';
  try { LANG = localStorage.getItem('lang') === 'en' ? 'en' : 'ja'; } catch(e){}
  let myBorn = null;
  try { myBorn = Number(localStorage.getItem('born')) || null; } catch(e){}

  const I18N = {
    ja: {
      h1:'みんなの9つ', sub:'ほかの人が何を選んだかを見る', make:'つくる', about:'このサイトについて',
      rank:'人気の作品 TOP 9', all:'すべて', ja:'日本語', en:'英語', age:'同年代',
      allDecades:'すべての年代', decade:'{d}年代',
      newest:'最新', hot:'人気', search:'検索', ph:'作品名や名前で探す',
      empty:'まだ何もありません。最初の1つを作ってみてください。',
      loading:'読み込んでいます…', failed:'読み込めませんでした。',
      like:'♥ いいね', liked:'♥ ありがとう', already:'♥ 済',
      noAge:'つくるページで9つ作るときに生まれた年を入れると、前後1年に生まれた人が選んだ作品のランキングが見られます。',
      noAgeTitle:'同年代のランキングは、まだ見られません',
      noAgeCta:'9つ作って参加する',
      noRank:'まだ集計できるデータがありません。',
      picks:'選', views:'view',
      my9:'作成されたMY9', my9note:'ほかの人が選んだ9つ。タップすると大きく見られます。',
      rankMore:'ランキングをすべて見る', openCard:'カードのページへ',
      pageLimit:'ここまでが表示できる範囲です。種類やならびを変えると、別の9つが見られます。',
      pr:'PR（アフィリエイトリンク）', user:'作った人を見る',
      kinds:{ '':'すべて', album:'CD', cd:'CD', book:'書籍', manga:'漫画', anime:'アニメ',
              movie:'映画', person:'有名人', character:'キャラ' },
    },
    en: {
      h1:'Everyone\u2019s nine', sub:'See what other people picked', make:'Make', about:'About',
      rank:'Most picked \u2014 top 9', all:'All', ja:'Japanese', en:'English', age:'My age group',
      allDecades:'All decades', decade:'{d}s',
      newest:'Newest', hot:'Popular', search:'Search', ph:'Search a title or name',
      empty:'Nothing here yet. Be the first.',
      loading:'Loading\u2026', failed:'Could not load.',
      like:'\u2665 Like', liked:'\u2665 Thanks', already:'\u2665 Done',
      noAge:'Add your birth year when you make a nine, and you can see what people born within a year of you picked.',
      noAgeTitle:'The same-age ranking is not available yet',
      noAgeCta:'Make your nine',
      noRank:'Not enough data yet.',
      picks:'picks', views:'views',
      my9:'Cards people made', my9note:'Tap a card to see it bigger.',
      rankMore:'See the full ranking', openCard:'Open the card page',
      pageLimit:'That is as far as this list goes. Try another kind or order.',
      pr:'PR (affiliate link)', user:'See the creator',
      kinds:{ '':'All', album:'Albums', cd:'Albums', book:'Books', manga:'Manga', anime:'Anime',
              movie:'Films', person:'People', character:'Chars' },
    },
  };
  const T = () => I18N[LANG];

  const state = { sort:'new', type:'', q:'', handle:'', page:1, scope:'all', decade:'' };
  const LIMIT = 10;          // 1ページに出す枚数
  const MAX_PAGE = 10;       // よくあるランキングサイトと同じく10ページで打ち切る

  // URLの ?handle=xxx で、その人の作品だけを見られる
  const params = new URLSearchParams(location.search);
  // /u/ユーザー名 でも ?handle=ユーザー名 でも受け付ける
  const fromPath = location.pathname.startsWith('/u/')
    ? decodeURIComponent(location.pathname.slice(3)) : '';
  state.handle = (fromPath || params.get('handle') || '').replace(/^@/, '');
  if (state.handle){
    document.querySelector('.head-text p').textContent = `@${state.handle} さんが選んだもの`;
  }

  // 各SNSのハッシュタグ検索へ。APIを使わないので費用はかからない
  const SNS_SEARCH = [
    ['X', tag => 'https://x.com/search?q=' + encodeURIComponent('#' + tag) + '&f=live'],
    ['Bluesky', tag => 'https://bsky.app/search?q=' + encodeURIComponent('#' + tag)],
    ['Threads', tag => 'https://www.threads.com/search?q=' + encodeURIComponent('#' + tag)],
    ['Misskey', tag => 'https://misskey.io/tags/' + encodeURIComponent(tag)],
  ];
  function updateXLink(){
    const tag = TAG[state.type] || 'MYNINE';
    const box = $('snslinks');
    box.innerHTML = '';
    SNS_SEARCH.forEach(([name, fn]) => {
      const a = document.createElement('a');
      a.className = 'xlink'; a.href = fn(tag);
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = `${name}で #${tag} を見る →`;
      box.appendChild(a);
    });
  }

  function since(iso){
    const d = (Date.now() - new Date(iso).getTime()) / 1000;
    if (d < 3600) return Math.max(1, Math.floor(d / 60)) + '分前';
    if (d < 86400) return Math.floor(d / 3600) + '時間前';
    if (d < 2592000) return Math.floor(d / 86400) + '日前';
    return new Date(iso).toLocaleDateString('ja-JP');
  }

  let adInflow = '';
  let adInflow2 = '';

  function render(items, append){
    const box = $('cards');
    if (!append) box.innerHTML = '';
    items.forEach((c, idx) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.addEventListener('click', () => openCard(c.id));

      // 選んだ9マスをそのまま並べる
      const grid = document.createElement('div');
      grid.className = 'mini';
      for (let i = 0; i < 9; i++){
        const cell = document.createElement('span');
        const src = (c.thumbs || [])[i];
        if (src){ const im = new Image(); im.src = src; im.alt = ''; im.loading = 'lazy'; cell.appendChild(im); }
        grid.appendChild(cell);
      }
      el.appendChild(grid);

      const foot = document.createElement('div');
      foot.className = 'card-foot';
      const body = document.createElement('div');
      body.className = 'body';
      const t = document.createElement('div');
      t.className = 't'; t.textContent = c.title || '無題';
      const m = document.createElement('div');
      m.className = 'm';
      const kind = document.createElement('span');
      kind.className = 'kind'; kind.textContent = LABEL[c.type] || c.type;
      m.appendChild(kind);
      m.appendChild(document.createTextNode(
        `${c.handle ? ' ・ @' + c.handle : ''} ・ ${since(c.created_at)}`));
      body.appendChild(t); body.appendChild(m);
      foot.appendChild(body);

      const num = document.createElement('div');
      num.className = 'num';
      num.innerHTML = `<b>${c.likes}</b> ♥ / <b>${c.views}</b> ${T().views}`;
      foot.appendChild(num);

      el.appendChild(foot);
      box.appendChild(el);
    });
  }

  /** 10件ずつ、ページ番号で送る。
      「もっと見る」で継ぎ足す形だと、目当ての1枚に戻れないため。 */
  async function load(page){
    if (typeof page === 'number') state.page = page;
    if (!state.page) state.page = 1;
    $('note').textContent = T().loading;
    // 次のページがあるかを知るため、1件多めに取る
    const p = new URLSearchParams({
      sort: state.sort, limit: LIMIT + 1, offset: (state.page - 1) * LIMIT,
    });
    if (state.type) p.set('type', state.type);
    // 書籍は日本の書籍しか扱えないので、英語の集計からは外す
    if (LANG === 'en' || state.scope === 'en') p.set('notype', 'book');
    if (state.handle) p.set('handle', state.handle);
    try{
      const r = await fetch('/x/cards?' + p);
      const j = await r.json();
      const all = j.items || [];
      const hasNext = all.length > LIMIT && state.page < MAX_PAGE;
      render(all.slice(0, LIMIT), false);
      $('note').textContent = $('cards').children.length ? '' : T().empty;

      // 総ページ数は分からないので、現在地の前後だけを出す
      const total = hasNext ? state.page + 1 : state.page;
      renderPager('cardsPager', state.page, total, n => {
        load(n);
        $('cards').scrollIntoView({ behavior:'smooth', block:'start' });
      });
      if (state.page >= MAX_PAGE) $('note').textContent = T().pageLimit;
    } catch(e){
      $('note').textContent = T().failed;
    }
  }

  $('sort').addEventListener('click', e => {
    const b = e.target.closest('button[data-sort]'); if (!b) return;
    state.sort = b.dataset.sort;
    [...$('sort').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    load(1);
  });
  $('kind').addEventListener('click', e => {
    const b = e.target.closest('button[data-type]'); if (!b) return;
    state.type = b.dataset.type;
    loadAds();                    // 種類に合った広告に差し替える
    [...$('kind').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    updateXLink();
    loadRank();
    load(1);
  });


  /* 広告は、いま絞り込んでいる種類に合わせる。
     漫画で絞っている人には漫画の案件、映画なら映画の案件が出る。
     「すべて」を見ているときは trends 用（無ければ common）に落ちる。
     ads.js が {種類}_{場所} → common_{場所} の順に探すので、
     ここでは種類名を渡すだけでよい。 */
  let adKind = '';
  function loadAds(){
    // 広告のキーはCDを 'cd' で持っている（保存上の種別名は 'album'）。
    // ADS_JSON を album_ に書き換えずに済むよう、ここで読み替える。
    const kind = state.type === 'album' ? 'cd' : (state.type || 'trends');
    if (kind === adKind) return;       // 同じ種類なら取り直さない
    adKind = kind;
    fetch(`/x/ads?kind=${encodeURIComponent(kind)}&lang=${LANG}`)
      .then(r => r.json()).then(a => {
        adInflow  = a.inflow || '';
        adInflow2 = a.inflow2 || '';
        $('adRail').innerHTML = a.rail || '';
        $('adRailLeft').innerHTML = a.railLeft || '';
        $('railR').style.display = a.rail ? '' : 'none';
        $('railL').style.display = a.railLeft ? '' : 'none';
        // MY9の一覧には差し込まない。300×250を2列の中に入れると
        // 列幅が押し広げられて並びが崩れるうえ、作品と広告が紛れる。
        // ランキングと一覧のあいだに、独立した枠として置く。
        const box = $('adMid');
        box.innerHTML = (adInflow || adInflow2)
          ? '<div class="pr-label">PR</div><div class="pr-row">'
            + (adInflow ? `<div>${adInflow}</div>` : '')
            + (adInflow2 ? `<div>${adInflow2}</div>` : '')
            + '</div>'
          : '';
        box.hidden = !box.innerHTML;
      }).catch(() => {});
  }
  loadAds();

  /* ---------- 作品ランキング ---------- */
  const RATIO = { album:'1/1', cd:'1/1', manga:'.7', book:'.67', anime:'.7',
                  movie:'.67', person:'.75', character:'.7' };

  function paintDecades(){
    const box = $('decades');
    box.innerHTML = '';
    const now = Math.floor(new Date().getFullYear() / 10) * 10;
    const list = [['', T().allDecades]];
    for (let d = now; d >= 1960; d -= 10) list.push([String(d), T().decade.replace('{d}', d)]);
    list.splice(1, 0, ['age', T().age]);   // 「すべての年代」の次に置く
    list.forEach(([v, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label;
      // 「すべての年代」と「同年代」だけ四角にする
      if (v === '' || v === 'age') b.dataset.kind = 'scope';
      b.setAttribute('aria-pressed', String(state.decade === v));
      b.addEventListener('click', () => { state.decade = v; paintDecades(); loadRank(); });
      box.appendChild(b);
    });
  }

  let rankRest = [];

  async function loadRank(){
    $('rankTitle').textContent = T().rank;
    $('scAll').textContent = T().all;
    $('scJa').textContent = T().ja;
    $('scEn').textContent = T().en;
    [...$('scope').children].forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.scope === state.scope)));

    document.documentElement.style.setProperty('--ratio', RATIO[state.type] || '.72');
    if (window.__packResize) window.__packResize();   // 表紙の比率に幅を合わせ直す

    const p = new URLSearchParams({ limit: 100 });   // 全一覧（最大10ページ）のぶんまで取る
    if (state.type) p.set('type', state.type);
    // 書籍は日本の書籍しか扱えないので、英語の集計からは外す
    if (LANG === 'en' || state.scope === 'en') p.set('notype', 'book');
    // 「同年代」は年代の並びの中にある。年齢が未入力なら案内を出して促す
    if (state.decade === 'age'){
      if (!myBorn){
        // 枠の下に小さく出すだけだと、スクロールしないと気づけない。
        // 9マスがあるはずの場所に、そのまま案内を出す。
        $('rank9').innerHTML =
          '<div class="needborn">'
          + '<p class="nb-t">' + T().noAgeTitle + '</p>'
          + '<p class="nb-d">' + T().noAge + '</p>'
          + '<a class="nb-b" href="/">' + T().noAgeCta + '</a>'
          + '</div>';
        $('rank').innerHTML = '';
        $('rankMore').style.display = 'none';
        $('rankNote').textContent = '';
        return;
      }
      p.set('age', String(myBorn));
    } else if (state.decade) {
      p.set('decade', state.decade);
    }
    if (state.scope === 'ja') p.set('lang', 'ja');
    if (state.scope === 'en') p.set('lang', 'en');

    $('rankNote').textContent = T().loading;
    try{
      const j = await (await fetch('/x/top?' + p)).json();
      const items = j.items || [];
      const top9 = items.slice(0, 9);
      rankRest = items.slice(9);
      rankAll  = items;            // 全一覧は1位から出す

      // 上位9件は3×3のかたまりで
      const pack = $('rank9');
      pack.innerHTML = '';
      for (let i = 0; i < 9; i++){
        const it = top9[i];
        const cell = document.createElement('div');
        cell.className = 'p';
        if (it){
          if (it.image_url){
            const im = new Image(); im.src = it.image_url; im.alt = it.title || ''; im.loading = 'lazy';
            cell.appendChild(im);
          }
          const no = document.createElement('span');
          no.className = 'no'; no.textContent = String(i + 1).padStart(2, '0');
          cell.appendChild(no);
          const nm = document.createElement('span');
          nm.className = 'nm'; nm.textContent = `${it.title} (${it.n})`;
          cell.appendChild(nm);
          cell.title = `${it.title}　${it.n} ${T().picks}`;
        }
        pack.appendChild(cell);
      }

      $('rank').innerHTML = '';
      $('rankMore').style.display = rankRest.length ? 'block' : 'none';
      $('rankMore').textContent = T().rankMore;
      $('rankNote').textContent = items.length ? '' : T().noRank;
    } catch(e){ $('rankNote').textContent = T().failed; }
  }

  /* ---------- ランキングの全一覧（1位から・ページ送り） ---------- */
  const RANK_PER_PAGE = 10;
  const RANK_MAX_PAGE = 10;          // よくあるランキングサイトと同じく10ページで打ち切る
  let rankAll = [];                  // 1位からの全件
  let rankPage = 1;

  function showRankRest(){
    rankPage = 1;
    $('rankFullTitle').textContent = $('rankTitle').textContent.replace(/ TOP 9$/, '');
    $('rankfull').classList.add('open');
    renderRankPage();
  }

  function renderRankPage(){
    const ol = $('rankFullList');
    ol.innerHTML = '';
    const start = (rankPage - 1) * RANK_PER_PAGE;
    rankAll.slice(start, start + RANK_PER_PAGE).forEach((it, i) => {
      const n = start + i + 1;
      const li = document.createElement('li');
      if (n <= 3) li.className = 'top' + n;      // 1〜3位は色を変える
      const no = document.createElement('span');
      no.className = 'no'; no.textContent = String(n);
      li.appendChild(no);
      if (it.image_url){
        const im = new Image(); im.src = it.image_url; im.alt = ''; im.loading = 'lazy';
        li.appendChild(im);
      }
      const info = document.createElement('div');
      info.className = 'info';
      const rt = document.createElement('div'); rt.className = 'rt'; rt.textContent = it.title || '';
      const rs = document.createElement('div'); rs.className = 'rs';
      rs.textContent = [it.sub, it.year].filter(Boolean).join(' ・ ');
      info.appendChild(rt); info.appendChild(rs);
      li.appendChild(info);
      const rn = document.createElement('span');
      rn.className = 'rn'; rn.textContent = `${it.n} ${T().picks}`;
      li.appendChild(rn);
      ol.appendChild(li);
    });
    renderPager('rankPager', rankPage,
      Math.min(Math.ceil(rankAll.length / RANK_PER_PAGE), RANK_MAX_PAGE),
      n => { rankPage = n; renderRankPage(); $('rankfull').scrollTop = 0; });
  }

  /** ページ番号の並びを作る。前後2ページと最初・最後を出す */
  function renderPager(id, cur, total, go){
    const box = $(id);
    box.innerHTML = '';
    if (total <= 1) return;
    const add = (label, n, on) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label;
      if (on) b.setAttribute('aria-pressed', 'true');
      if (n == null) { b.disabled = true; b.className = 'gap'; }
      else b.addEventListener('click', () => go(n));
      box.appendChild(b);
    };
    if (cur > 1) add('‹', cur - 1);
    const nums = new Set([1, total, cur, cur - 1, cur + 1]);
    let last = 0;
    [...nums].filter(n => n >= 1 && n <= total).sort((a, b) => a - b).forEach(n => {
      if (n - last > 1) add('…', null);
      add(String(n), n, n === cur);
      last = n;
    });
    if (cur < total) add('›', cur + 1);
  }

  $('rankMore').addEventListener('click', showRankRest);

  /* 書籍は楽天ブックス（日本の書籍）に依存しているため、英語のカードには存在しない。
     UIが英語のときと、ランキングの絞り込みで「英語」を選んでいるときは、
     押しても空になるだけなのでボタンごと隠す。
     選択中だった場合は「すべて」に戻す。 */
  function syncBookButton(){
    const hide = LANG === 'en' || state.scope === 'en';
    const btn = [...$('kind').children].find(b => b.dataset.type === 'book');
    if (btn) btn.style.display = hide ? 'none' : '';
    if (hide && state.type === 'book'){

      [...$('kind').children].forEach(b =>
        b.setAttribute('aria-pressed', String(!b.dataset.type)));
      loadAds();
      load(1);
    }
  }

  $('scope').addEventListener('click', e => {
    const b = e.target.closest('button[data-scope]'); if (!b) return;
    state.scope = b.dataset.scope;

    loadRank();

  /* ---------- カードの拡大表示 ---------- */
  const liked = new Set();
  let cvId = null;

  /** カードをタップしたときは /c/ のページをそのまま開く。
      作品名・購入リンク・OGPなど、共有相手が見るものと同じ画面になる。 */
  function openCard(id){

  /** 以前の拡大表示。いまは使っていないが、戻したいときのために残してある */
  async function openCardInline(id){
    cvId = id;
    $('cardv').classList.add('open');
    $('cvTitle').textContent = T().loading;
    $('cvGrid').innerHTML = ''; $('cvDetail').innerHTML = '';
    try{
      const c = await (await fetch('/x/card?id=' + encodeURIComponent(id))).json();
      $('cvTitle').textContent = c.title || '';
      $('cvMeta').textContent =
        `${LABEL[c.type] || c.type} ・ ${c.views} ${T().views} ・ ${c.likes} ♥`;
      $('cvLikeN').textContent = c.likes;
      $('cvLike').setAttribute('aria-pressed', String(liked.has(id)));
      $('cvOpen').href = '/c/' + id;
      $('cvOpen').textContent = T().openCard;
      if (c.handle){
        $('cvUser').href = 'https://x.com/' + c.handle;
        $('cvUser').textContent = '@' + c.handle;
        $('cvUser').style.display = '';
      } else $('cvUser').style.display = 'none';

      document.documentElement.style.setProperty('--ratio', RATIO[c.type] || '.72');

      const grid = $('cvGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 9; i++){
        const it = (c.items || []).find(v => v.position === i);
        const cell = document.createElement('div');
        cell.className = 'p';
        if (it){
          if (it.image_url){
            const im = new Image(); im.src = it.image_url; im.alt = it.title || ''; im.loading = 'lazy';
            cell.appendChild(im);
          }
          const nm = document.createElement('span');
          nm.className = 'nm'; nm.textContent = it.title || '';
          cell.appendChild(nm);
          cell.addEventListener('click', () => showItem(it));
        }
        grid.appendChild(cell);
      }
    } catch(e){ $('cvTitle').textContent = T().failed; }
  }

  /** 作品をタップしたときの詳細と購入先 */
  function showItem(it){
    const box = $('cvDetail');
    box.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'cv-item';
    const h = document.createElement('div');
    h.className = 'h';
    if (it.image_url){ const im = new Image(); im.src = it.image_url; im.alt = ''; h.appendChild(im); }
    const tw = document.createElement('div');
    tw.innerHTML = `<div class="t"></div><div class="s"></div>`;
    tw.querySelector('.t').textContent = it.title || '';
    tw.querySelector('.s').textContent = [it.sub, it.year].filter(Boolean).join(' ・ ');
    h.appendChild(tw);
    d.appendChild(h);

    if ((it.links || []).length){
      const pr = document.createElement('span');
      pr.className = 'pr'; pr.textContent = T().pr;

  $('cardClose').addEventListener('click', () => $('cardv').classList.remove('open'));

  /* ---------- 言語の適用 ---------- */
  function applyLang(){

  /* ------------------------------------------------------------------ *
   * 前面に何かを出しているあいだ、後ろの画面を動かさない
   *
   * スマホでは、モーダルの端まで指を滑らせると裏のページが動いてしまう。
   * 開いている間だけ body を固定し、閉じたら元の位置へ正確に戻す。
   * position:fixed にするのは、iOSが overflow:hidden だけでは止まらないため。
   * ------------------------------------------------------------------ */
  (function lockBehindScroll(){
    let savedY = 0, locked = false;
    const anyOpen = () => !!document.querySelector('.veil.open');

    function apply(){
      const open = anyOpen();
      if (open && !locked){
        savedY = window.scrollY || window.pageYOffset || 0;
        document.body.style.position = 'fixed';
        document.body.style.top = `-${savedY}px`;
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
        locked = true;
      } else if (!open && locked){
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        window.scrollTo(0, savedY);   // 開く前に見ていた位置へ戻す
        locked = false;
      }
    }

    // open クラスの付け外しを見張る。呼び出し側を1つずつ直さなくて済む
    const mo = new MutationObserver(apply);
    document.querySelectorAll('.veil').forEach(v =>
      mo.observe(v, { attributes: true, attributeFilter: ['class'] }));
    apply();
  })();


  /* ------------------------------------------------------------------ *
   * レールの上限位置を、ヘッダーとタブの実際の高さから決める
   *
   * 決め打ちの値にしていたときは、言語の切り替えや拡大率でヘッダーの
   * 高さが変わると、そこに広告が潜り込んでいた。
   * 実測して CSS 変数に入れることで、どの状態でも下に収まる。
   * ------------------------------------------------------------------ */
  (function railTop(){
    function apply(){
      const nav = document.querySelector('nav.tabs') || document.querySelector('header');
      if (nav){
        const bottom = Math.ceil(nav.getBoundingClientRect().bottom + window.scrollY);
        document.documentElement.style.setProperty('--rail-top', (bottom + 12) + 'px');
      }
      // 広告の開始位置は本文の始まり。ヘッダーの真下から始めると、
      // 大きい画面では最初から全体が入ってしまい、動く余地が無くなる。
      const main = document.querySelector('.wrap') || document.querySelector('main');
      if (main){
        const top = Math.ceil(main.getBoundingClientRect().top + window.scrollY);
        // 本文の始まりに合わせる。下げすぎると、上のほうで
        // 広告のある場所が空白に見えてしまう。
        document.documentElement.style.setProperty('--rail-start', (top + 20) + 'px');
      }
    }
    apply();
    window.addEventListener('resize', apply);
    window.addEventListener('load', apply);
    if (window.ResizeObserver){
      const el = document.querySelector('header');
      if (el) new ResizeObserver(apply).observe(el);
    }
  })();


  /* ------------------------------------------------------------------ *
   * 左右のレール広告の追従
   *
   * CSSの position:sticky は使えない。body に zoom を掛けているため、
   * Chromium では zoom の内側の sticky が正しく動かず、
   * JSで測った座標（拡大後）とCSSに渡す値（拡大前）も倍率ぶんずれる。
   *
   * そこで位置を自分で計算する。動きは次のとおり。
   *   1. 上のほうでは本文と一緒に流れる（下がはみ出していてもよい）
   *   2. 広告の下端が画面の下に収まりきった時点で貼り付く
   *   3. 上に戻すと、また一緒に流れる
   * ------------------------------------------------------------------ */
  /* ランキングの高さを、画面の余りから決める。
     ランキングの上端から画面の下までを使い、少しだけ余白を残す。 */
  (function packHeight(){
    function apply(){
      if (window.innerWidth < 900) {
        document.documentElement.style.removeProperty('--pack-h');
        return;
      }
      const wrap = document.querySelector('.packwrap');
      if (!wrap) return;
      const z = parseFloat(getComputedStyle(document.body).zoom) || 1;
      // ページ最上部を基準にすると、ヘッダー・タブ・絞り込み・年代の
      // すべてを差し引くことになり、表紙がかなり小さくなる。
      // そこで「ランキングを見ている状態」を基準にする。
      // 見出しのぶん(HEAD)だけ残し、あとは画面の高さをそのまま使う。
      // 少しスクロールすれば9つが1画面に収まる。
      const HEAD = 150;                                  // 見出しと上下の余白
      const h = (window.innerHeight - HEAD) / z;
      // 1px単位で揺れないよう8px刻みに丸める。
      // 端数がそのまま入ると、わずかな差で再計算が繰り返され安定しない。
      const packH = Math.round(Math.max(380, Math.min(h, 1100)) / 8) * 8;
      const root = document.documentElement;
      // 高さは変わったときだけ書き換える（毎回書くと監視が反応して揺れる）
      if (root.style.getPropertyValue('--pack-h') !== packH + 'px') {
        root.style.setProperty('--pack-h', packH + 'px');
      }

      // マスの横幅を表紙の比率に合わせる。
      // 幅が余ったままだと、表紙の左右に大きな余白ができる（contain のため）。
      const ratio = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue('--ratio')) || 0.72;
      const gap = 5, pad = 8;
      const cellH = (packH - pad * 2 - gap * 2) / 3;
      const packW = Math.round(cellH * ratio * 3 + gap * 2 + pad * 2);
      // 幅は種類の切り替えでも変わるので、高さが同じでも必ず見直す
      if (root.style.getPropertyValue('--pack-w') !== packW + 'px') {
        root.style.setProperty('--pack-w', packW + 'px');
      }
    }
    window.__packResize = apply;     // 種類や年代を切り替えたときに呼ぶ
    apply();
    window.addEventListener('resize', apply);
    window.addEventListener('load', apply);
    // main を監視すると、自分で高さを変える → 監視が反応する → また変える、
    // という繰り返しになり、大きさが揺れて落ち着かない。
    // ランキングより「上」にあるものだけを見る。
    if (window.ResizeObserver){
      const obs = new ResizeObserver(apply);
      ['#kind', '#decades', '#scope'].forEach(sel => {
        const el = document.querySelector(sel);
        if (el) obs.observe(el);
      });
    }
  })();

  (function railFollow(){
    // 貼り付いたとき、広告が画面の中央あたりに来るようにする。
    // 画面の下端に合わせると、視線から外れた低い位置に留まってしまう。
    const rails = [...document.querySelectorAll('.rail')];
    if (!rails.length) return;

    const zoom = () => parseFloat(getComputedStyle(document.body).zoom) || 1;

    function place(rail){
      const ad = rail.querySelector('.slot-ad');
      if (!ad || !ad.innerHTML.trim()) return;
      if (getComputedStyle(rail).display === 'none') return;

      const z = zoom();
      const vh = window.innerHeight;                 // 画面の高さ（拡大後）
      const adH = ad.getBoundingClientRect().height; // 広告の高さ（拡大後）

      // 画像がまだ読み込まれていないと高さがほぼ0になり、
      // 中央の計算が狂って画面の下のほうに置かれてしまう。
      // 高さが取れるようになるまでは、位置を決めない。
      if (adH < 60) { ad.style.position = ''; ad.style.top = ''; ad.style.width = ''; return; }


      // 貼り付いていない状態での上端を求めるため、いったん解除して測る
      ad.style.position = '';
      ad.style.top = '';
      ad.style.width = '';
      const naturalTop = ad.getBoundingClientRect().top;

      // 画面の余りを上下に均等に振り分けた位置（＝中央）に貼り付ける。
      // 入りきらない画面では、上を少しだけ空けた位置になる。
      const HEAD = 12;                                  // 「PR」の文字ぶん
      const centered = Math.max(HEAD, (vh - adH) / 2);

      // 上端がその位置まで上がってきたら貼り付く
      if (naturalTop <= centered) {
        const railRect = rail.getBoundingClientRect();
        let top = centered;

        // ただし列の下端（フッターの手前）より下には行かせない。
        // 行かせるとフッターに重なったまま画面に残り続ける。
        const limit = railRect.bottom - adH;
        if (limit < top) top = limit;

        ad.style.position = 'fixed';
        // fixed の座標は拡大前の値で解釈されるので、倍率で割って渡す
        ad.style.top   = (top / z) + 'px';
        ad.style.width = (railRect.width / z) + 'px';
      }
    }

    let ticking = false;
    function update(){
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { rails.forEach(place); ticking = false; });
    }

    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    window.addEventListener('load', update);
    // 広告は後から差し込まれる。中身が入ったときと、
    // その中の画像が読み終わったときの両方で測り直す。
    function watchImages(root){
      root.querySelectorAll('img').forEach(im => {
        if (im.dataset.railWatched) return;
        im.dataset.railWatched = '1';
        // A8のHTMLには width/height が入っている。読み込み前でも
        // その寸法で場所を確保しておけば、高さ0にならず位置が跳ねない。
        const w = Number(im.getAttribute('width')), h = Number(im.getAttribute('height'));
        if (w > 1 && h > 1 && !im.style.aspectRatio) im.style.aspectRatio = w + ' / ' + h;
        if (!im.complete) {
          im.addEventListener('load', update, { once: true });
          im.addEventListener('error', update, { once: true });
        }
      });
    }
    rails.forEach(r => {
      new MutationObserver(() => { watchImages(r); update(); })
        .observe(r, { childList: true, subtree: true });
      watchImages(r);
      // 画像の読み込みが終わっても高さが確定しない場合に備えて、少し後にも測る
      [300, 1000, 2500].forEach(ms => setTimeout(update, ms));
    });
    update();
  })();

</script>
