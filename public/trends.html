<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<title>みんなの9つ | MY NINE LOVES</title>
<meta name="description" content="みんなが選んだ9つを、最新順・人気順で見られます。">
<style>
  :root{
    --ink:#EFF2E8;
    --panel:#FFFFFF;
    --panel-2:#E4E9DA;
    --line:#C8D0BB;
    --text:#1B1F19;
    --muted:#5F6858;
    --obi:#FFC61A;
    --obi-deep:#E09600;
    --pop:#E03A5F;
    --alert:#C9302C;
    --head:#25302A;
    --head-text:#F2F6EC;
    --shadow:0 2px 0 rgba(200,208,187,.8);
    --r:12px;



    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--gothic);
       -webkit-font-smoothing:antialiased;padding-bottom:60px}
  @media (min-width:1024px){ body{zoom:1.10} }
  @media (min-width:1600px){ body{zoom:1.15} }
  a{color:var(--pop)}
  .langsw{display:flex;border:1px solid #56624F;border-radius:999px;overflow:hidden}
  .langopt{background:transparent;border:0;color:#A9B6A2;cursor:pointer;
    font-family:var(--gothic);font-size:11px;padding:6px 13px;white-space:nowrap}
  .langopt:hover{color:var(--obi)}
  .langopt[aria-pressed=true]{background:var(--obi);color:#2A2622;font-weight:700}
  header{display:flex;background:var(--head);color:var(--head-text);align-items:stretch}
  .obi-tab{background:var(--obi);color:#2A2622;font-family:var(--mono);font-size:11px;
           letter-spacing:.18em;padding:14px 10px;writing-mode:vertical-rl}
  .head-text{padding:18px 16px}
  .head-text h1{font-family:var(--mincho);font-weight:600;font-size:22px;margin:0 0 4px;letter-spacing:.06em}
  .head-text p{margin:0;font-size:12px;color:#A9B6A2}
  .head-meta{margin-left:auto;padding:18px;display:flex;align-items:center;gap:14px;font-size:11px;color:#A9B6A2}
  main{max-width:760px;margin:0 auto;padding:24px 20px}
  .tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{padding:13px 20px;font-size:13px;color:var(--muted);text-decoration:none;
    white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
  .tab:hover{color:var(--text);background:var(--panel-2)}
  .tab.on{color:var(--text);font-weight:700;border-bottom-color:var(--obi)}

  /* 年代の切り替え。数が多いので、セグメントではなく個別のチップにして折り返す */
  .decades{display:flex;flex-wrap:wrap;gap:6px;border:0;margin-bottom:12px}
  .decades button{
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-family:var(--gothic);font-size:11px;padding:7px 12px;
    border-radius:999px;cursor:pointer;
  }
  .decades button[aria-pressed=true]{background:var(--obi);color:#2A2622;
    border-color:var(--obi-deep);font-weight:700}

  /* 左右のレール */
  .rail{display:none}
  @media (min-width:1180px){
    .rail{position:fixed;top:260px;width:170px;display:block;
      font-size:9px;color:var(--muted);text-align:center;
      letter-spacing:.16em;font-family:var(--mono)}
    .rail-l{right:calc(50% + 396px)}
    .rail-r{left:calc(50% + 396px)}
    .rail .slot-ad{display:flex;align-items:flex-start;justify-content:center;
      margin-top:6px;max-height:calc(100vh - 290px);overflow:hidden}
    .rail img{max-width:100%;height:auto}
  }

  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .seg button{background:var(--panel);border:0;border-left:1px solid var(--line);
    color:var(--muted);font-family:var(--gothic);font-size:12px;padding:9px 14px;cursor:pointer}
  .seg button:first-child{border-left:0}
  .seg button[aria-pressed=true]{background:var(--obi);color:#2A2622;font-weight:700}
  .search{display:flex;gap:6px;flex:1;min-width:200px}
  .search input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:var(--gothic);font-size:14px;padding:9px 11px;border-radius:var(--r)}
  .search input:focus{outline:2px solid var(--obi);outline-offset:1px;border-color:transparent}
  .search button{background:var(--obi);color:#2A2622;border:0;font-weight:700;
    padding:0 16px;border-radius:var(--r);cursor:pointer}

  .xlink{flex:1;min-width:150px;text-align:center;padding:11px 12px;
    border:1px solid var(--line);border-radius:var(--r);font-size:12px;
    text-decoration:none;color:var(--muted)}
  .xlink:hover{border-color:var(--pop);color:var(--pop);background:#FCEFF2}

  .ranksec{margin-bottom:26px}
  .rank-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .rank-head .seg{flex-wrap:wrap}
  .rank-head h2{font-family:var(--mincho);font-size:19px;margin:0;flex:1;min-width:180px}
  .decades{margin-bottom:12px;flex-wrap:wrap}
  .decades button{font-size:11px;padding:7px 11px}
  .rank{list-style:none;margin:0 0 10px;padding:0;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  .rank li{display:flex;align-items:center;gap:11px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;box-shadow:var(--shadow)}
  .rank .no{font-family:var(--mono);font-size:12px;color:var(--muted);width:22px;flex:0 0 auto}
  .rank img{width:38px;height:52px;object-fit:cover;border-radius:4px;background:var(--panel-2);flex:0 0 auto}
  .rank .info{min-width:0;flex:1}
  .rank .rt{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .rs{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .rn{font-family:var(--mono);font-size:11px;color:var(--pop);flex:0 0 auto}

  .cards{display:grid;gap:10px}
  .card{display:flex;align-items:center;gap:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
    box-shadow:var(--shadow)}
  .card:hover{border-color:var(--obi)}
  .card .body{flex:1;min-width:0}
  .mini{
    display:grid;grid-template-columns:repeat(3,1fr);gap:2px;
    width:66px;flex:0 0 auto;text-decoration:none;
  }
  .mini span{
    aspect-ratio:.72;background:var(--panel-2);border-radius:2px;overflow:hidden;
    display:block;
  }
  .mini img{width:100%;height:100%;object-fit:cover;display:block}
  .card .t{font-family:var(--mincho);font-size:16px;margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .m{font-size:11px;color:var(--muted)}
  .card .m .kind{color:var(--pop);font-weight:700}
  .card .num{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;flex:0 0 auto}
  .card .num b{color:var(--text);font-weight:500}
  .like{background:none;border:1px solid var(--line);color:var(--muted);border-radius:var(--r);
    padding:7px 11px;font-size:12px;cursor:pointer;flex:0 0 auto}
  .like:hover{border-color:var(--pop);color:var(--pop);background:#FCEFF2}
  .like[disabled]{opacity:.5;cursor:default}

  .note{font-size:12px;color:var(--muted);text-align:center;padding:28px 0;line-height:1.8}
  .more{display:block;width:100%;margin-top:14px;padding:13px;background:var(--panel);
    border:1px solid var(--line);color:var(--text);border-radius:var(--r);cursor:pointer;font-size:13px}
  footer{max-width:760px;margin:40px auto 0;padding:20px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);line-height:1.9}
</style>
</head>
<body>

<header>
  <div class="obi-tab">MY NINE LOVES</div>
  <div class="head-text">
    <h1>みんなの9つ</h1>
    <p>ほかの人が何を選んだかを見る</p>
  </div>
  <div class="head-meta">
    <div class="langsw" role="group" aria-label="Language">
      <button type="button" class="langopt" data-lang="ja">日本語</button>
      <button type="button" class="langopt" data-lang="en">English</button>
    </div>
  </div>
</header>

<nav class="tabs">
  <a href="/" class="tab" id="navMake">つくる</a>
  <a href="/trends" class="tab on" id="navTrends">みんなの9つ</a>
  <a href="/about" class="tab" id="navAbout">このサイトについて</a>
</nav>

<aside class="rail rail-r" id="railR" aria-label="広告" style="display:none">
  <span>PR</span><div class="slot-ad" id="adRail"></div>
</aside>
<aside class="rail rail-l" id="railL" aria-label="広告" style="display:none">
  <span>PR</span><div class="slot-ad" id="adRailLeft"></div>
</aside>

<main>

  <div class="bar">
    <div class="seg" id="sort" role="group">
      <button type="button" data-sort="new" aria-pressed="true">最新</button>
      <button type="button" data-sort="hot" aria-pressed="false">人気</button>
    </div>
    <div class="seg" id="kind" role="group">
      <button type="button" data-type="" aria-pressed="true">すべて</button>
      <button type="button" data-type="cd" aria-pressed="false">CD</button>
      <button type="button" data-type="book" aria-pressed="false">書籍</button>
      <button type="button" data-type="manga" aria-pressed="false">漫画</button>
      <button type="button" data-type="anime" aria-pressed="false">アニメ</button>
      <button type="button" data-type="movie" aria-pressed="false">映画</button>
      <button type="button" data-type="person" aria-pressed="false">有名人</button>
      <button type="button" data-type="character" aria-pressed="false">キャラ</button>
    </div>
  </div>

  <div class="search bar">
    <input type="text" id="q" placeholder="作品名や名前で探す" autocomplete="off">
    <button type="button" id="go">検索</button>
  </div>

  <div class="bar" id="snslinks"></div>

  <section class="ranksec">
    <div class="rank-head">
      <h2 id="rankTitle">人気の作品 TOP 9</h2>
      <div class="seg" id="scope">
        <button type="button" data-scope="all" aria-pressed="true" id="scAll">すべて</button>
        <button type="button" data-scope="ja" aria-pressed="false" id="scJa">日本語</button>
        <button type="button" data-scope="en" aria-pressed="false" id="scEn">英語</button>
        <button type="button" data-scope="age" aria-pressed="false" id="scAge">同年代</button>
      </div>
    </div>
    <div class="decades" id="decades"></div>
    <ol class="rank" id="rank"></ol>
    <p class="note" id="rankNote"></p>
  </section>

  <div id="adTop" style="margin-bottom:16px"></div>
  <div class="cards" id="cards"></div>
  <p class="note" id="note">読み込んでいます…</p>
  <button class="more" id="more" style="display:none">もっと見る</button>

</main>

<footer>
  <a href="/">トップ</a> ｜ <a href="/about">このサイトについて</a> ｜
  <a href="/terms">利用規約</a> ｜ <a href="/privacy-policy">プライバシーポリシー</a> ｜ <a href="/contact">お問い合わせ</a>
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const LABEL_JA = { cd:'CD', manga:'漫画', book:'書籍', anime:'アニメ',
                     movie:'映画', person:'有名人', character:'キャラ' };
  const LABEL = new Proxy({}, { get: (_, k) => T().kinds[k] || LABEL_JA[k] });
  // 共有時に必ず付く共通タグ。種類別タグは補助なので、ここでは共通タグを追う
  const TAG = { '':'MyNineLoves', cd:'MyNineLoves', manga:'MyNineLoves', book:'MyNineLoves',
                anime:'MyNineLoves', movie:'MyNineLoves',
                person:'MyNineLoves', character:'MyNineLoves' };

  let LANG = 'ja';
  try { LANG = localStorage.getItem('lang') === 'en' ? 'en' : 'ja'; } catch(e){}
  let myBorn = null;
  try { myBorn = Number(localStorage.getItem('born')) || null; } catch(e){}

  const I18N = {
    ja: {
      h1:'みんなの9つ', sub:'ほかの人が何を選んだかを見る', make:'つくる', about:'このサイトについて',
      rank:'人気の作品 TOP 9', all:'すべて', ja:'日本語', en:'英語', age:'同年代',
      allDecades:'すべての年代', decade:'{d}年代',
      newest:'最新', hot:'人気', search:'検索', ph:'作品名や名前で探す',
      empty:'まだ何もありません。最初の1つを作ってみてください。',
      loading:'読み込んでいます…', failed:'読み込めませんでした。',
      more:'もっと見る', like:'♥ いいね', liked:'♥ ありがとう', already:'♥ 済',
      noAge:'年齢を入れて9つを作ると、同じ年代のランキングが見られます。',
      noRank:'まだ集計できるデータがありません。',
      picks:'選', views:'view',
      kinds:{ '':'すべて', cd:'CD', book:'書籍', manga:'漫画', anime:'アニメ',
              movie:'映画', person:'有名人', character:'キャラ' },
    },
    en: {
      h1:'Everyone\u2019s nine', sub:'See what other people picked', make:'Make', about:'About',
      rank:'Most picked \u2014 top 9', all:'All', ja:'Japanese', en:'English', age:'My age group',
      allDecades:'All decades', decade:'{d}s',
      newest:'Newest', hot:'Popular', search:'Search', ph:'Search a title or name',
      empty:'Nothing here yet. Be the first.',
      loading:'Loading\u2026', failed:'Could not load.',
      more:'Show more', like:'\u2665 Like', liked:'\u2665 Thanks', already:'\u2665 Done',
      noAge:'Add your age when you make a nine to unlock this.',
      noRank:'Not enough data yet.',
      picks:'picks', views:'views',
      kinds:{ '':'All', cd:'Albums', book:'Books', manga:'Manga', anime:'Anime',
              movie:'Films', person:'People', character:'Chars' },
    },
  };
  const T = () => I18N[LANG];

  const state = { sort:'new', type:'', q:'', handle:'', offset:0, scope:'all', decade:'' };
  const LIMIT = 24;
  const liked = new Set();

  // URLの ?handle=xxx で、その人の作品だけを見られる
  const params = new URLSearchParams(location.search);
  // /u/ユーザー名 でも ?handle=ユーザー名 でも受け付ける
  const fromPath = location.pathname.startsWith('/u/')
    ? decodeURIComponent(location.pathname.slice(3)) : '';
  state.handle = (fromPath || params.get('handle') || '').replace(/^@/, '');
  if (state.handle){
    $('q').placeholder = `@${state.handle} さんの9つ`;
    document.querySelector('.head-text p').textContent = `@${state.handle} さんが選んだもの`;
  }

  // 各SNSのハッシュタグ検索へ。APIを使わないので費用はかからない
  const SNS_SEARCH = [
    ['X', tag => 'https://x.com/search?q=' + encodeURIComponent('#' + tag) + '&f=live'],
    ['Bluesky', tag => 'https://bsky.app/search?q=' + encodeURIComponent('#' + tag)],
    ['Threads', tag => 'https://www.threads.com/search?q=' + encodeURIComponent('#' + tag)],
    ['Misskey', tag => 'https://misskey.io/tags/' + encodeURIComponent(tag)],
  ];
  function updateXLink(){
    const tag = TAG[state.type] || 'MYNINE';
    const box = $('snslinks');
    box.innerHTML = '';
    SNS_SEARCH.forEach(([name, fn]) => {
      const a = document.createElement('a');
      a.className = 'xlink'; a.href = fn(tag);
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = `${name}で #${tag} を見る →`;
      box.appendChild(a);
    });
  }

  function since(iso){
    const d = (Date.now() - new Date(iso).getTime()) / 1000;
    if (d < 3600) return Math.max(1, Math.floor(d / 60)) + '分前';
    if (d < 86400) return Math.floor(d / 3600) + '時間前';
    if (d < 2592000) return Math.floor(d / 86400) + '日前';
    return new Date(iso).toLocaleDateString('ja-JP');
  }

  let adInflow = '';

  function render(items, append){
    const box = $('cards');
    if (!append) box.innerHTML = '';
    items.forEach((c, idx) => {
      // 一覧の途中に1つだけ挟む。カードと同じ見た目にせず、PRと明示する
      if (!append && idx === 5 && adInflow){
        const ad = document.createElement('div');
        ad.style.cssText = 'padding:14px 16px;border:1px solid var(--line);'
          + 'border-radius:var(--r);background:var(--panel)';
        ad.innerHTML = '<div style="font-family:var(--mono);font-size:9px;'
          + 'letter-spacing:.2em;color:var(--muted);margin-bottom:8px">PR</div>' + adInflow;
        box.appendChild(ad);
      }
      const el = document.createElement('div');
      el.className = 'card';

      // 作った9マスをそのまま小さく再現する
      const grid = document.createElement('a');
      grid.className = 'mini';
      grid.href = '/u/' + (c.handle || '');
      if (!c.handle) { grid.removeAttribute('href'); grid.style.cursor = 'default'; }
      for (let i = 0; i < 9; i++){
        const cell = document.createElement('span');
        const src = (c.thumbs || [])[i];
        if (src){ const im = new Image(); im.src = src; im.alt = ''; im.loading = 'lazy'; cell.appendChild(im); }
        grid.appendChild(cell);
      }
      el.appendChild(grid);

      const body = document.createElement('div');
      body.className = 'body';
      const t = document.createElement('div');
      t.className = 't'; t.textContent = c.title || '無題';
      const m = document.createElement('div');
      m.className = 'm';
      const kind = document.createElement('span');
      kind.className = 'kind'; kind.textContent = LABEL[c.type] || c.type;
      m.appendChild(kind);
      const rest = document.createTextNode(
        `${c.name ? ' ・ ' + c.name : ''}${c.handle ? ' ・ @' + c.handle : ''} ・ ${since(c.created_at)}`);
      m.appendChild(rest);
      body.appendChild(t); body.appendChild(m);

      const num = document.createElement('div');
      num.className = 'num';
      num.innerHTML = `<b>${c.likes}</b> ♥<br><b>${c.views}</b> ${T().views}`;

      const like = document.createElement('button');
      like.className = 'like'; like.textContent = T().like;
      like.addEventListener('click', async () => {
        if (liked.has(c.id)) return;
        liked.add(c.id); like.disabled = true;
        try{
          const r = await fetch('/x/like', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ id: c.id }),
          });
          const j = await r.json();
          if (j.likes != null) num.innerHTML = `<b>${j.likes}</b> ♥<br><b>${c.views}</b> view`;
          like.textContent = j.already ? T().already : T().liked;
        } catch(e){ like.textContent = '失敗'; }
      });

      el.appendChild(body); el.appendChild(num); el.appendChild(like);
      box.appendChild(el);
    });
  }

  async function load(append){
    if (!append){ state.offset = 0; $('note').textContent = T().loading; }
    const p = new URLSearchParams({ sort: state.sort, limit: LIMIT, offset: state.offset });
    if (state.type) p.set('type', state.type);
    if (state.q) p.set('q', state.q);
    if (state.handle) p.set('handle', state.handle);
    try{
      const r = await fetch('/x/cards?' + p);
      const j = await r.json();
      const items = j.items || [];
      render(items, append);
      state.offset += items.length;
      $('more').style.display = items.length === LIMIT ? 'block' : 'none';
      $('note').textContent = $('cards').children.length ? '' : T().empty;
    } catch(e){
      $('note').textContent = T().failed;
    }
  }

  $('sort').addEventListener('click', e => {
    const b = e.target.closest('button[data-sort]'); if (!b) return;
    state.sort = b.dataset.sort;
    [...$('sort').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    load(false);
  });
  $('kind').addEventListener('click', e => {
    const b = e.target.closest('button[data-type]'); if (!b) return;
    state.type = b.dataset.type;
    [...$('kind').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    updateXLink();
    loadRank();
    load(false);
  });
  $('go').addEventListener('click', () => { state.q = $('q').value.trim(); load(false); });
  $('q').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ state.q = $('q').value.trim(); load(false); }
  });
  $('more').addEventListener('click', () => load(true));

  // このページ用の広告（作品を探しに来た層なので、レンタル・配信が合う）
  function loadAds(){
    fetch('/x/ads?kind=trends&lang=' + LANG).then(r => r.json()).then(a => {
      adInflow = a.inflow || '';
      $('adRail').innerHTML = a.rail || '';
      $('adRailLeft').innerHTML = a.railLeft || '';
      $('railR').style.display = a.rail ? '' : 'none';
      $('railL').style.display = a.railLeft ? '' : 'none';
      $('adTop').innerHTML = '';
      if (adInflow) load(false);   // 広告が来たら描き直して差し込む
    }).catch(() => {});
  }
  loadAds();

  /* ---------- 作品ランキング ---------- */
  function paintDecades(){
    const box = $('decades');
    box.innerHTML = '';
    const now = Math.floor(new Date().getFullYear() / 10) * 10;
    const list = [['', T().allDecades]];
    for (let d = now; d >= 1960; d -= 10) list.push([String(d), T().decade.replace('{d}', d)]);
    list.forEach(([v, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label;
      b.setAttribute('aria-pressed', String(state.decade === v));
      b.addEventListener('click', () => { state.decade = v; paintDecades(); loadRank(); });
      box.appendChild(b);
    });
  }

  async function loadRank(){
    $('rankTitle').textContent = T().rank;
    $('scAll').textContent = T().all;
    $('scJa').textContent = T().ja;
    $('scEn').textContent = T().en;
    $('scAge').textContent = T().age;
    [...$('scope').children].forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.scope === state.scope)));

    if (state.scope === 'age' && !myBorn){
      $('rank').innerHTML = ''; $('rankNote').textContent = T().noAge; return;
    }
    const p = new URLSearchParams({ limit: 9 });
    if (state.type) p.set('type', state.type);
    if (state.decade) p.set('decade', state.decade);
    if (state.scope === 'ja') p.set('lang', 'ja');
    if (state.scope === 'en') p.set('lang', 'en');
    if (state.scope === 'age' && myBorn) p.set('age', Math.floor(myBorn / 10) * 10);

    $('rankNote').textContent = T().loading;
    try{
      const r = await fetch('/x/top?' + p);
      const j = await r.json();
      const items = j.items || [];
      const ol = $('rank'); ol.innerHTML = '';
      items.forEach((it, i) => {
        const li = document.createElement('li');
        const no = document.createElement('span');
        no.className = 'no'; no.textContent = String(i + 1).padStart(2, '0');
        li.appendChild(no);
        if (it.image_url){
          const im = new Image(); im.src = it.image_url; im.alt = ''; im.loading = 'lazy';
          li.appendChild(im);
        }
        const info = document.createElement('div');
        info.className = 'info';
        const rt = document.createElement('div');
        rt.className = 'rt'; rt.textContent = it.title || '';
        const rs = document.createElement('div');
        rs.className = 'rs';
        rs.textContent = [it.sub, it.year].filter(Boolean).join(' ・ ');
        info.appendChild(rt); info.appendChild(rs);
        li.appendChild(info);
        const rn = document.createElement('span');
        rn.className = 'rn'; rn.textContent = `${it.n} ${T().picks}`;
        li.appendChild(rn);
        ol.appendChild(li);
      });
      $('rankNote').textContent = items.length ? '' : T().noRank;
    } catch(e){ $('rankNote').textContent = T().failed; }
  }

  $('scope').addEventListener('click', e => {
    const b = e.target.closest('button[data-scope]'); if (!b) return;
    state.scope = b.dataset.scope; loadRank();
  });

  /* ---------- 言語の適用 ---------- */
  function applyLang(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('.langopt').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
    document.querySelector('.head-text h1').textContent = T().h1;
    document.querySelector('.head-text p').textContent =
      state.handle ? `@${state.handle}` : T().sub;
    $('navMake').textContent = T().make;
    $('navTrends').textContent = T().h1;
    $('navAbout').textContent = T().about;
    $('q').placeholder = T().ph;
    $('go').textContent = T().search;
    $('more').textContent = T().more;
    [...$('sort').children].forEach(b => {
      b.textContent = b.dataset.sort === 'hot' ? T().hot : T().newest;
    });
    [...$('kind').children].forEach(b => {
      b.textContent = T().kinds[b.dataset.type] || b.textContent;
      // 書籍は日本の楽天ブックスに依存しているため、英語では出さない
      if (b.dataset.type === 'book') b.style.display = LANG === 'en' ? 'none' : '';
    });
    if (LANG === 'en' && state.type === 'book'){
      state.type = '';
      [...$('kind').children].forEach(b => b.setAttribute('aria-pressed', String(!b.dataset.type)));
    }
    paintDecades();
    updateXLink();
    loadRank();
    load(false);
  }

  document.querySelector('.langsw').addEventListener('click', e => {
    const b = e.target.closest('.langopt');
    if (!b || b.dataset.lang === LANG) return;
    LANG = b.dataset.lang;
    try { localStorage.setItem('lang', LANG); } catch(e){}
    applyLang();
    loadAds();
  });

  applyLang();
})();
</script>
</body>
</html>
